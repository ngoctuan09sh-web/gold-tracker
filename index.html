<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi vàng</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14110b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vàng">
<style>
:root{
  --bg:#14110b; --bg2:#1d1910; --card:#241f13; --line:#3a321e; --txt:#f4ecd8; --mut:#a89c7c;
  --gold:#e6b422; --gold2:#ffd966; --ok:#5ad19a; --bad:#ff7a6b;
  --sjc:#e6b422; --pnj:#e8826b; --khac:#6fb7d9; --g9999:#e6b422; --g97:#b58cd9;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#3a2d0c 0,transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
h1 .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),#b8860b);display:grid;place-items:center;color:#3a2a00;font-weight:800;font-size:15px}
.tools button{margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 12px;border-radius:9px;transition:.15s}
button:hover{border-color:var(--gold);color:var(--gold2)}
button.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2a00;border:0;font-weight:700}
button.primary:hover{filter:brightness(1.08);color:#3a2a00}
button.del{padding:3px 9px;color:var(--mut)}button.del:hover{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{padding:10px 22px;border-radius:12px;font-weight:600;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
.tab.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2a00;border-color:transparent}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:15px;color:var(--gold2);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.price{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.price label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.price .row{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price input{font-size:22px;font-weight:700;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--txt);padding:2px 0;outline:0}
.price input:focus{border-color:var(--gold)}
.price small{color:var(--mut);white-space:nowrap}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--mut)}
.live .st{display:flex;align-items:center;gap:7px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.pulse.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(90,209,154,.6);animation:p 2s infinite}
.pulse.err{background:var(--bad)}.pulse.load{background:var(--gold);animation:p 1s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(90,209,154,0)}100%{box-shadow:0 0 0 0 rgba(90,209,154,0)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--bg2);color:var(--mut);padding:5px 11px}
.seg button.on{background:var(--gold);color:#3a2a00;font-weight:700}
.price .src{font-size:11px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.price .src a{color:var(--gold2);cursor:pointer;text-decoration:underline}
.price.manual{border-color:var(--gold)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.total{display:flex;flex-direction:column;justify-content:center}
.total .lbl{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.total .big{font-size:46px;font-weight:800;color:var(--gold2);line-height:1.1;margin:6px 0 2px}
.total .big span{font-size:20px;color:var(--gold);font-weight:600;margin-left:4px}
.total .sub{color:var(--mut)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:120px}
.chip b{display:block;font-size:19px}.chip span{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.donutbox{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.legend em{color:var(--mut);font-style:normal;margin-left:auto;padding-left:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut);font-size:12.5px}
th.g{color:#2a1f00;font-size:13px;letter-spacing:.5px}
th.g.sjc{background:var(--sjc)}th.g.pnj{background:var(--pnj)}th.g.khac{background:var(--khac)}
td.l,th.l{text-align:left}
td input,td select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 7px;font:inherit;width:100%;min-width:62px;text-align:center}
td input.t{text-align:left}
td input:focus,td select:focus{outline:0;border-color:var(--gold)}
td input[type=date]{color-scheme:dark;min-width:130px}
tfoot td{font-weight:700;color:var(--gold2);border-bottom:0;background:rgba(230,180,34,.07)}
.scroll{overflow-x:auto}
.sumtable td,.sumtable th{padding:9px 10px}
.sumtable td.r,.sumtable th.r{text-align:right}
.sumtable tr.tot td{font-weight:800;color:var(--gold2);font-size:16px;border-bottom:0;background:rgba(230,180,34,.09)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#2a1f00}
.pos{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo">Au</span> Theo dõi vàng</h1>
    <div class="tools">
      <button id="btnExport">⬇ Xuất file</button>
      <button id="btnImport">⬆ Nhập file</button>
      <button id="btnReset">🗑 Xoá hết</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </header>

  <div class="panel">
    <h2>Giá vàng hôm nay <small style="text-transform:none;letter-spacing:0;color:var(--mut)">(triệu đồng / cây)</small></h2>
    <div class="live"><span class="st"><i class="pulse" id="pulse"></i><span id="liveTxt">Đang tải giá…</span></span>
      <button id="btnLive">⟳ Cập nhật</button>
      <span class="seg" id="basis"><button data-m="buy">Giá mua vào</button><button data-m="sell">Giá bán ra</button></span>
      <button id="btnInstall" hidden class="primary">⬇ Cài app</button></div>
    <div class="prices" id="prices"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <p class="hint">Dữ liệu tự lưu trong trình duyệt này. 1 cây = 10 chỉ. Nên bấm “Xuất file” để sao lưu định kỳ.</p>
</div>

<script>
/* ---------- Dữ liệu ---------- */
const KEY = 'gold-tracker-v1';
const TYPES = {
  SJC:{name:'SJC',color:'var(--sjc)'},
  PNJ:{name:'PNJ',color:'var(--pnj)'},
  '9999':{name:'Vàng 9999',color:'var(--g9999)'},
  '97':{name:'Vàng 97',color:'var(--g97)'}
};
// Cột của sheet "chung": nhóm, tên, quy đổi ra chỉ
const COLS = [
  {g:'SJC',  n:'3 phân',        w:0.3},
  {g:'SJC',  n:'5 phân',        w:0.5},
  {g:'SJC',  n:'Thẻ 1 chỉ',     w:1},
  {g:'SJC',  n:'Nhẫn 1 chỉ',    w:1},
  {g:'SJC',  n:'Nhẫn 2 chỉ',    w:2},
  {g:'PNJ',  n:'Nhẫn 5 phân',   w:0.5},
  {g:'PNJ',  n:'Nhẫn 1 chỉ',    w:1},
  {g:'Khác', n:'9999 – 1 chỉ',  w:1},
  {g:'Khác', n:'5 phân',        w:0.5},
  {g:'Khác', n:'2-3 phân',      w:0.25},
  {g:'Khác', n:'Công ty SJC',   w:1},
];
const GROUPS = {SJC:{price:'SJC',cls:'sjc',color:'var(--sjc)'},PNJ:{price:'PNJ',cls:'pnj',color:'var(--pnj)'},'Khác':{price:'9999',cls:'khac',color:'var(--khac)'}};
const serial = n => new Date(Date.UTC(1899,11,30)+n*864e5).toISOString().slice(0,10);

function seed(){   // dữ liệu trống — số liệu thật nhập tay hoặc dùng "Nhập file"
  return {
    prices:{SJC:145.2,PNJ:143.5,'9999':128.5,'97':127.5},
    chung:{rows:[{name:'Nơi cất 1',c:COLS.map(()=>0)}],notes:[]},
    people:{'Người 1':[]}
  };
}
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prices) S=seed();
S.basis=S.basis||'buy'; S.manual=S.manual||{}; S.live=S.live||null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

/* ---------- Tính toán ---------- */
const num = v => { const x=parseFloat(String(v).replace(',','.')); return isFinite(x)?x:0; };
const fmt = (v,d=2)=>v.toLocaleString('vi-VN',{minimumFractionDigits:0,maximumFractionDigits:d});
const val = (chi,type)=> chi/10*num(S.prices[type]);          // triệu đồng
const vnd = tr => fmt(Math.round(tr*1e6),0)+' ₫';

function chungTotals(){
  const colSum=COLS.map((c,i)=>S.chung.rows.reduce((s,r)=>s+num(r.c[i]),0));
  const grp={};
  for(const g in GROUPS) grp[g]={chi:0,qty:0};
  COLS.forEach((c,i)=>{grp[c.g].chi+=colSum[i]*c.w; grp[c.g].qty+=colSum[i];});
  for(const g in grp) grp[g].val=val(grp[g].chi,GROUPS[g].price);
  const chi=Object.values(grp).reduce((s,x)=>s+x.chi,0);
  const v=Object.values(grp).reduce((s,x)=>s+x.val,0);
  return {colSum,grp,chi,val:v};
}
function personTotals(name){
  const by={};
  S.people[name].forEach(l=>{by[l.type]=(by[l.type]||0)+num(l.chi)});
  const rows=Object.keys(TYPES).filter(t=>by[t]!==undefined).map(t=>({type:t,chi:by[t],val:val(by[t],t)}));
  return {rows,chi:rows.reduce((s,r)=>s+r.chi,0),val:rows.reduce((s,r)=>s+r.val,0)};
}

/* ---------- UI helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e;};
let tab='chung', live=[];   // live: các hàm cập nhật số liệu khi gõ
const refresh=()=>{live.forEach(f=>f());save();};
const bind=(el,fn)=>{live.push(()=>{el.textContent=fn()});return el;};

function donut(parts){ // parts:[{label,value,color}]
  const tot=parts.reduce((s,p)=>s+p.value,0)||1,R=62,C=2*Math.PI*R;let off=0,segs='';
  parts.forEach(p=>{const l=p.value/tot*C;segs+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=l;});
  return `<svg width="160" height="160" viewBox="0 0 160 160"><circle r="${R}" cx="80" cy="80" fill="none" stroke="#2c2616" stroke-width="26"/>${segs}</svg>`;
}
function hero(getTotals,parts){ // parts: [{label,color,get:()=>({chi,val})}]
  const big=h('div',{class:'big'}),sub=h('div',{class:'sub'}),chips=h('div',{class:'chips'}),dn=h('div',{class:'donutbox'});
  live.push(()=>{
    const t=getTotals();
    big.innerHTML=`${fmt(t.val)}<span>triệu</span>`;
    sub.textContent=`≈ ${vnd(t.val)}  •  ${fmt(t.chi)} chỉ (${fmt(t.chi/10,3)} cây)`;
    const ps=parts.map(p=>({...p,...p.get()}));
    chips.innerHTML=ps.map(p=>`<div class="chip"><span><i class="dot" style="background:${p.color}"></i>${p.label}</span><b>${fmt(p.val)} tr</b><span>${fmt(p.chi)} chỉ</span></div>`).join('');
    dn.innerHTML=donut(ps.map(p=>({label:p.label,value:p.val,color:p.color})))+
      `<div class="legend">${ps.map(p=>`<div><i class="dot" style="background:${p.color}"></i>${p.label}<em>${t.val?fmt(p.val/t.val*100,1):0}%</em></div>`).join('')}</div>`;
  });
  return h('div',{class:'hero'},
    h('div',{class:'panel total'},h('div',{class:'lbl'},'Tổng giá trị vàng'),big,sub,chips),
    h('div',{class:'panel'},h('div',{class:'donutbox'},dn)));
}

/* ---------- Giá vàng thực tế ---------- */
// PNJ trả giá theo nghìn đồng/chỉ  →  ×10/1000 = triệu đồng/cây
// Vàng 97 không có bảng giá riêng: dùng giá vàng nữ trang 99,2% (gần nhất với cách tính cũ trong file)
const PNJ_MAP={SJC:'SJC',PNJ:'PNJ','9999':'24K','97':'9920'};
const PNJ_URL='https://edge-api.pnj.io/ecom-frontend/v1/get-gold-price?zone=00';
const BACKUP_URL='https://www.vang.today/api/prices';
const SRC_LABEL={SJC:'SJC',PNJ:'PNJ Phượng Hoàng','9999':'PNJ 24K (999.9)','97':'PNJ 99,2%'};
async function fetchJSON(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
async function getPrices(){
  try{
    const d=await fetchJSON(PNJ_URL),raw={};
    for(const t in PNJ_MAP){const x=d.data.find(i=>i.masp===PNJ_MAP[t]);if(!x)throw new Error('thiếu '+t);raw[t]={buy:x.giamua/100,sell:x.giaban/100};}
    return {raw,src:'PNJ',at:d.updateDate||''};
  }catch(e1){
    const d=await fetchJSON(BACKUP_URL),P=d.prices, raw={};
    const m=(k)=>({buy:P[k].buy/1e6,sell:P[k].sell/1e6});
    raw.SJC=m('SJL1L10');raw.PNJ=m('PQHNVM');raw['9999']=m('PQHN24NTT');
    raw['97']={buy:raw['9999'].buy*0.992,sell:raw['9999'].sell*0.992};
    return {raw,src:'vang.today',at:d.date+' '+d.time};
  }
}
function applyLive(){
  if(!S.live)return;
  for(const t in TYPES){ if(S.manual[t])continue; const r=S.live.raw[t]; if(r) S.prices[t]=Math.round(r[S.basis]*100)/100; }
}
let liveState='idle';
function setStatus(kind,txt){const p=$('#pulse');if(p){p.className='pulse '+kind;$('#liveTxt').textContent=txt;}}
function statusText(){
  if(!S.live)return 'Chưa có giá thực tế';
  return `Giá ${S.live.src} • cập nhật ${S.live.at||new Date(S.live.fetched).toLocaleString('vi-VN')}`;
}
async function refreshLive(){
  setStatus('load','Đang cập nhật giá…');
  try{
    const r=await getPrices();
    S.live={...r,fetched:Date.now()};
    applyLive();save();
    setStatus('ok',statusText());
    renderPrices();live.forEach(f=>f());
  }catch(e){
    setStatus('err',(S.live?'Không kết nối được, đang dùng giá đã lưu • ':'Không lấy được giá • ')+(S.live?statusText():'nhập tay bên dưới'));
  }
}
function renderPrices(){
  const box=$('#prices');box.innerHTML='';
  Object.keys(TYPES).forEach(t=>{
    const manual=!!S.manual[t];
    const inp=h('input',{type:'number',step:'0.1',value:S.prices[t]});
    inp.addEventListener('input',()=>{S.manual[t]=true;S.prices[t]=num(inp.value);save();live.forEach(f=>f());box.children[Object.keys(TYPES).indexOf(t)].classList.add('manual');});
    inp.addEventListener('change',renderPrices);
    const lr=S.live&&S.live.raw[t];
    const other=lr?(S.basis==='buy'?['Bán ra',lr.sell]:['Mua vào',lr.buy]):null;
    box.append(h('div',{class:'price'+(manual?' manual':'')},
      h('label',{},h('i',{class:'dot',style:`background:${TYPES[t].color}`}),TYPES[t].name,
        h('span',{style:'margin-left:auto;font-size:11px'},S.basis==='buy'?'mua vào':'bán ra')),
      h('div',{class:'row'},inp,h('small',{},'tr/cây')),
      h('div',{class:'src'},
        manual?h('span',{},'✎ Nhập tay'):h('span',{},(SRC_LABEL[t]||'')+(other?` • ${other[0]} ${fmt(other[1])}`:'')),
        manual&&S.live?h('a',{onclick:()=>{delete S.manual[t];applyLive();save();renderPrices();live.forEach(f=>f());}},'↺ Tự động'):'')));
  });
  document.querySelectorAll('#basis button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.basis));
}
$('#basis').onclick=e=>{const m=e.target.dataset.m;if(!m)return;S.basis=m;applyLive();save();renderPrices();live.forEach(f=>f());};
$('#btnLive').onclick=refreshLive;

/* ---------- Sheet: chung ---------- */
function renderChung(v){
  v.append(hero(chungTotals,Object.keys(GROUPS).map(g=>({label:g==='Khác'?'Vàng khác':g==='PNJ'?'Vàng PNJ':'Vàng SJC',color:GROUPS[g].color,get:()=>chungTotals().grp[g]}))));

  // Bảng kiểm kê
  const head1=h('tr',{},h('th',{class:'l',rowspan:2},'Nơi cất'));
  const gs=[...new Set(COLS.map(c=>c.g))];
  gs.forEach(g=>head1.append(h('th',{class:'g '+GROUPS[g].cls,colspan:COLS.filter(c=>c.g===g).length},g==='Khác'?'Vàng khác':'Vàng '+g)));
  head1.append(h('th',{rowspan:2},'Tổng chỉ'),h('th',{rowspan:2}));
  const head2=h('tr',{},COLS.map(c=>h('th',{html:`${c.n}<br><small>${c.w} chỉ</small>`})));
  const tb=h('tbody'),tf=h('tfoot');
  S.chung.rows.forEach((r,ri)=>{
    const tr=h('tr',{});
    const nm=h('input',{class:'t',value:r.name});nm.addEventListener('input',()=>{r.name=nm.value;save();});
    tr.append(h('td',{class:'l'},nm));
    COLS.forEach((c,i)=>{
      const inp=h('input',{type:'number',min:0,step:'any',value:r.c[i]||''});
      inp.addEventListener('input',()=>{r.c[i]=num(inp.value);refresh();});
      tr.append(h('td',{},inp));
    });
    tr.append(h('td',{},bind(h('b'),()=>fmt(COLS.reduce((s,c,i)=>s+num(r.c[i])*c.w,0)))));
    tr.append(h('td',{},h('button',{class:'del',title:'Xoá dòng',onclick:()=>{if(confirm('Xoá "'+r.name+'"?')){S.chung.rows.splice(ri,1);save();render();}}},'✕')));
    tb.append(tr);
  });
  const ft=h('tr',{},h('td',{class:'l'},'Tổng số lượng'));
  COLS.forEach((c,i)=>ft.append(bind(h('td'),()=>fmt(chungTotals().colSum[i]))));
  ft.append(bind(h('td'),()=>fmt(chungTotals().chi)),h('td'));
  tf.append(ft);
  v.append(h('div',{class:'panel'},h('h2',{},'Kiểm kê vàng theo nơi cất (số lượng từng loại)'),
    h('div',{class:'scroll'},h('table',{},h('thead',{},head1,head2),tb,tf)),
    h('div',{class:'foot'},h('span',{class:'hint'},'Nhập số lượng (cái) của từng loại; app tự quy đổi ra chỉ.'),
      h('button',{onclick:()=>{S.chung.rows.push({name:'Nơi cất mới',c:COLS.map(()=>0)});save();render();}},'＋ Thêm nơi cất'))));

  // Tổng kết
  const st=h('tbody');
  Object.keys(GROUPS).forEach(g=>{
    const G=GROUPS[g];
    st.append(h('tr',{},
      h('td',{class:'l'},h('i',{class:'dot',style:`background:${G.color};margin-right:8px`}),g==='Khác'?'Vàng khác (tính giá 9999)':'Vàng '+g),
      h('td',{class:'r'},bind(h('span'),()=>fmt(chungTotals().grp[g].chi))),
      h('td',{class:'r'},bind(h('span'),()=>fmt(S.prices[G.price]))),
      h('td',{class:'r'},bind(h('b'),()=>fmt(chungTotals().grp[g].val)+' tr'))));
  });
  st.append(h('tr',{class:'tot'},h('td',{class:'l'},'Tổng'),
    h('td',{class:'r'},bind(h('span'),()=>fmt(chungTotals().chi))),h('td'),
    h('td',{class:'r'},bind(h('span'),()=>fmt(chungTotals().val)+' tr'))));
  v.append(h('div',{class:'panel'},h('h2',{},'Tổng kết vàng'),
    h('table',{class:'sumtable'},h('thead',{},h('tr',{},h('th',{class:'l'},'Loại'),h('th',{class:'r'},'Tổng chỉ'),h('th',{class:'r'},'Giá (tr/cây)'),h('th',{class:'r'},'Giá trị'))),st)));

  // Ghi chú mua
  const nb=h('tbody');
  S.chung.notes.forEach((n,ni)=>{
    const t=h('input',{class:'t',value:n.t}),p=h('input',{type:'number',value:n.price,step:'any'}),d=h('input',{type:'date',value:n.date});
    t.oninput=()=>{n.t=t.value;save()};p.oninput=()=>{n.price=num(p.value);save()};d.oninput=()=>{n.date=d.value;save()};
    nb.append(h('tr',{},h('td',{class:'l'},t),h('td',{},p),h('td',{},d),h('td',{},h('button',{class:'del',onclick:()=>{S.chung.notes.splice(ni,1);save();render();}},'✕'))));
  });
  v.append(h('div',{class:'panel'},h('h2',{},'Ghi chú giá mua'),
    h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{class:'l'},'Mô tả'),h('th',{},'Giá mua'),h('th',{},'Ngày mua'),h('th'))),nb)),
    h('div',{class:'foot'},h('span',{class:'hint'},'Chỉ để ghi nhớ, không ảnh hưởng tổng giá trị.'),
      h('button',{onclick:()=>{S.chung.notes.push({t:'',price:'',date:''});save();render();}},'＋ Thêm ghi chú'))));
}

/* ---------- Sheet: từng người ---------- */
function renameBtns(name){
  return h('div',{class:'foot',style:'justify-content:flex-end'},
    h('button',{onclick:()=>{const n=(prompt('Tên mới?',name)||'').trim();if(!n||n===name)return;if(n==='chung'||S.people[n]){alert('Tên đã tồn tại');return;}
      const o={};for(const k in S.people)o[k===name?n:k]=S.people[k];S.people=o;tab=n;save();render();}},'✎ Đổi tên'),
    h('button',{class:'del',onclick:()=>{if(confirm('Xoá "'+name+'" và toàn bộ vàng của người này?')){delete S.people[name];tab='chung';save();render();}}},'🗑 Xoá người này'));
}
function renderPerson(v,name){
  const T=()=>personTotals(name);
  v.append(hero(T,Object.keys(TYPES).map(t=>({label:TYPES[t].name,color:TYPES[t].color,get:()=>{const r=T().rows.find(x=>x.type===t);return r?r:{chi:0,val:0}}}))));

  const tb=h('tbody');
  S.people[name].forEach((l,i)=>{
    const sel=h('select',{},Object.keys(TYPES).map(t=>h('option',{value:t,...(l.type===t?{selected:''}:{})},TYPES[t].name)));
    const chi=h('input',{type:'number',min:0,step:'any',value:l.chi}),pr=h('input',{type:'number',step:'any',value:l.price,placeholder:'—'}),dt=h('input',{type:'date',value:l.date});
    sel.onchange=()=>{l.type=sel.value;refresh()};chi.oninput=()=>{l.chi=num(chi.value);refresh()};
    pr.oninput=()=>{l.price=pr.value===''?'':num(pr.value);save()};dt.oninput=()=>{l.date=dt.value;save()};
    tb.append(h('tr',{},h('td',{},sel),h('td',{},chi),h('td',{},pr),h('td',{},dt),
      h('td',{class:'r'},bind(h('b'),()=>fmt(val(num(l.chi),l.type),3)+' tr')),
      h('td',{},h('button',{class:'del',onclick:()=>{S.people[name].splice(i,1);save();render();}},'✕'))));
  });
  v.append(h('div',{class:'panel'},h('h2',{},'Vàng của '+name),
    h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Loại vàng'),h('th',{},'Số chỉ'),h('th',{},'Giá lúc mua'),h('th',{},'Ngày mua'),h('th',{},'Giá trị hiện tại'),h('th'))),tb)),
    h('div',{class:'foot'},h('span',{class:'hint'},'Mỗi dòng là một lần mua. Giá trị = số chỉ ÷ 10 × giá hiện tại (tr/cây).'),
      h('button',{class:'primary',onclick:()=>{S.people[name].push({type:'PNJ',chi:0,price:'',date:new Date().toISOString().slice(0,10)});save();render();}},'＋ Thêm lần mua'))));

  const st=h('tbody');
  Object.keys(TYPES).forEach(t=>{
    const row=h('tr',{},h('td',{class:'l'},h('i',{class:'dot',style:`background:${TYPES[t].color};margin-right:8px`}),TYPES[t].name),
      h('td',{class:'r'},bind(h('span'),()=>fmt((T().rows.find(x=>x.type===t)||{chi:0}).chi,3))),
      h('td',{class:'r'},bind(h('span'),()=>fmt(S.prices[t]))),
      h('td',{class:'r'},bind(h('b'),()=>fmt((T().rows.find(x=>x.type===t)||{val:0}).val,3)+' tr')));
    st.append(row);
  });
  st.append(h('tr',{class:'tot'},h('td',{class:'l'},'Tổng giá trị'),h('td',{class:'r'},bind(h('span'),()=>fmt(T().chi,3))),h('td'),h('td',{class:'r'},bind(h('span'),()=>fmt(T().val,3)+' tr'))));
  v.append(h('div',{class:'panel'},h('h2',{},'Giá trị từng loại'),
    h('table',{class:'sumtable'},h('thead',{},h('tr',{},h('th',{class:'l'},'Loại vàng'),h('th',{class:'r'},'Tổng chỉ'),h('th',{class:'r'},'Giá hiện tại (tr/cây)'),h('th',{class:'r'},'Giá trị'))),st)));
  v.append(renameBtns(name));
}

/* ---------- Điều hướng ---------- */
function render(){
  live=[];
  const tabs=$('#tabs');tabs.innerHTML='';
  [['chung','Chung'],...Object.keys(S.people).map(n=>[n,n])].forEach(([k,l])=>
    tabs.append(h('button',{class:'tab'+(tab===k?' on':''),onclick:()=>{tab=k;render();}},l)));
  tabs.append(h('button',{class:'tab',title:'Thêm người',onclick:()=>{const n=(prompt('Tên người mới?')||'').trim();if(!n)return;if(n==='chung'||S.people[n]){alert('Tên đã tồn tại');return;}S.people[n]=[];tab=n;save();render();}},'＋'));
  const v=$('#view');v.innerHTML='';
  if(tab==='chung')renderChung(v);else{ if(!S.people[tab])tab='chung'; tab==='chung'?renderChung(v):renderPerson(v,tab);}
  live.forEach(f=>f());
}
$('#btnExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='vang-'+new Date().toISOString().slice(0,10)+'.json';a.click();};
$('#btnImport').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.prices||!d.chung||!d.people)throw 0;S=d;S.basis=S.basis||'buy';S.manual=S.manual||{};save();renderPrices();render();refreshLive();}catch(_){alert('File không hợp lệ');}});e.target.value='';};
$('#btnReset').onclick=()=>{if(confirm('Xoá toàn bộ dữ liệu trên thiết bị này? (Hãy bấm Xuất file trước nếu cần giữ lại)')){S=seed();S.basis='buy';S.manual={};save();renderPrices();render();refreshLive();}};
renderPrices();render();
applyLive();renderPrices();live.forEach(f=>f());
if(S.live)setStatus('',statusText());
refreshLive();
setInterval(refreshLive,60000);                       // tự cập nhật mỗi phút khi đang mở app
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLive();});
window.addEventListener('online',refreshLive);

/* ---------- Cài app (PWA) ---------- */
let deferred;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#btnInstall').hidden=false;});
$('#btnInstall').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#btnInstall').hidden=true;};
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true;});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script>
