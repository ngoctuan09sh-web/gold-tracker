<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi vàng</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f0f2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vàng">
<style>
:root{
  --bg:#f0f2f5; --surf:#ffffff; --surf2:#f6f7f9; --line:#dde1e7; --txt:#1c2127; --mut:#5f6874;
  --accent:#8a5f00; --accent-bg:#e8edf4; --primary:#f2b705; --on-primary:#2b2000;
  --ok:#14805a; --bad:#c23b2b; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --sjc:#dd9b00; --pnj:#e0604f; --g9999:#1f9e8e; --khac:#1f9e8e; --g97:#7b61c9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418; --surf:#1a1e24; --surf2:#222730; --line:#313843; --txt:#eceff3; --mut:#9aa4b2;
  --accent:#f4c94a; --accent-bg:#273040; --ok:#4cc790; --bad:#ff8272; --shadow:0 1px 2px rgba(0,0,0,.4);
  --sjc:#f0b429; --pnj:#ee7b6b; --g9999:#3fc2b1; --khac:#3fc2b1; --g97:#a38ce6;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--txt);padding:8px 14px;border-radius:10px;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
button.del{min-height:36px;padding:4px 10px;color:var(--mut)}button.del:hover{color:var(--bad);border-color:var(--bad)}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:8px}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);min-width:0;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{flex:none;width:9px;height:9px;border-radius:50%;background:var(--mut)}
.pulse.ok{background:var(--ok)}.pulse.err{background:var(--bad)}.pulse.load{background:var(--primary);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:10px;min-height:40px;min-width:40px;display:grid;place-items:center;font-size:20px;line-height:1}
.menu summary::-webkit-details-marker{display:none}
.menu .dd{position:absolute;right:0;top:46px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:30}
.menu .dd button{border:0;text-align:left;background:transparent}
.menu .dd button:hover{background:var(--surf2)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:99px;padding:8px 20px;font-weight:600;color:var(--mut);background:var(--surf)}
.tab.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700}
.card h2 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:16px}}
.hero .lbl{font-size:14px;color:var(--mut);font-weight:600}
.hero .big{font-size:clamp(38px,8vw,56px);font-weight:800;line-height:1.05;margin:4px 0 6px;color:var(--accent);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .big span{font-size:18px;font-weight:600;margin-left:8px;color:var(--mut)}
.hero .sub{color:var(--mut);font-size:15px}.hero .sub b{color:var(--txt)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surf2);border:1px solid var(--line)}
.stack i{display:block;min-width:0}
.leg{margin-top:12px;display:grid;gap:8px}
.lg{display:grid;grid-template-columns:14px 1fr auto 52px;gap:10px;align-items:center;font-size:15px}
.lg .dot{width:12px;height:12px;border-radius:4px}
.lg b{font-variant-numeric:tabular-nums}.lg em{font-style:normal;color:var(--mut);text-align:right;font-size:14px}

details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--mut);transition:.15s}
details.card[open]>summary::before{transform:rotate(90deg)}
summary .ttl{font-weight:700;font-size:17px}
summary .psum{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.plbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surf2);color:var(--mut);min-height:36px;padding:6px 14px}
.seg button.on{background:var(--txt);color:var(--bg);font-weight:600}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.price{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:5px solid var(--c,var(--line))}
.price.manual{outline:2px solid var(--primary)}
.price label{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.price label span{font-weight:400;color:var(--mut);font-size:12.5px}
.price .row{display:flex;align-items:baseline;gap:8px;margin:2px 0}
.price input{font:inherit;font-size:26px;font-weight:800;width:100%;min-width:0;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--txt);padding:2px 0;font-variant-numeric:tabular-nums}
.price input:hover,.price input:focus{border-bottom-color:var(--line);outline:0}
.price small{color:var(--mut);white-space:nowrap}
.price .src{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.price .src a{color:var(--accent);cursor:pointer;font-weight:600;white-space:nowrap}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);background:var(--surf)}
tbody tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--mut);font-size:13px;line-height:1.25}
th small{font-weight:400;display:block}
th.g{color:var(--txt);font-size:14px;background:color-mix(in srgb,var(--c) 10%,var(--surf));border-top:4px solid var(--c)}
td.l,th.l{text-align:left}
.inv th.l,.inv td.l{position:sticky;left:0;z-index:2;min-width:130px;box-shadow:1px 0 0 var(--line)}
.inv td input.num{width:66px}
td input,td select{font:inherit;font-size:16px;background:var(--surf2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;width:100%;min-height:42px;text-align:center}
td input.t{text-align:left;font-weight:600}
td input::placeholder{color:var(--mut);opacity:.5}
td input[type=date]{min-width:150px;color-scheme:light dark}
tfoot td{font-weight:700;background:var(--accent-bg);color:var(--txt);border-bottom:0}
.inv td.tot{font-weight:700;background:var(--surf2)}
.sum td,.sum th{padding:12px 12px}
.sum .r{text-align:right}
.sum td.l{font-weight:600}
.sum tr.total td{font-weight:800;font-size:17px;background:var(--accent-bg);border-bottom:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:9px;vertical-align:-1px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:13.5px}
p.hint{text-align:center;margin:22px 0 40px}

@media(max-width:640px){
  .wrap{padding:0 12px}.card{padding:14px;border-radius:14px}
  .brand b{display:none}
  .lots thead{display:none}
  .lots,.lots tbody{display:block}
  .scroll.lots{border:0}
  .lots tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surf2)}
  .lots td{display:block;border:0;padding:0;text-align:left;background:transparent}
  .lots td::before{content:attr(data-label);display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
  .lots td.val{grid-column:1;align-self:end;font-size:18px}
  .lots td.act{grid-column:2;text-align:right;align-self:end}.lots td.act::before{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="icon-192.png" alt=""><b>Theo dõi vàng</b></div>
  <div class="pill" id="livePill"><i class="pulse" id="pulse"></i><span id="liveTxt">Đang tải giá…</span></div>
  <button id="btnLive" title="Cập nhật giá ngay" aria-label="Cập nhật giá">⟳</button>
  <button id="btnInstall" hidden class="primary">Cài app</button>
  <details class="menu" id="menu"><summary aria-label="Menu">⋯</summary>
    <div class="dd">
      <button id="btnExport">⬇ Xuất file sao lưu</button>
      <button id="btnImport">⬆ Nhập file</button>
      <button id="btnReset">🗑 Xoá hết dữ liệu</button>
    </div>
  </details>
  <input type="file" id="file" accept=".json" hidden>
</div></header>

<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <div id="heroBox"></div>

  <details class="card" id="pricesD" open>
    <summary><span class="ttl">Giá vàng hôm nay</span><span class="psum" id="psum"></span></summary>
    <div class="plbar"><span class="seg" id="basis"><button data-m="buy">Giá mua vào</button><button data-m="sell">Giá bán ra</button></span>
      <span class="hint">Triệu đồng / cây. Bấm vào số để nhập tay.</span></div>
    <div class="prices" id="prices"></div>
  </details>

  <div id="view"></div>
  <p class="hint">Dữ liệu tự lưu trên thiết bị này • 1 cây = 10 chỉ • Dùng menu ⋯ → “Xuất file” để sao lưu hoặc chuyển sang máy khác.</p>
</div>

<script>
/* ---------- Dữ liệu ---------- */
const KEY = 'gold-tracker-v1';
const TYPES = {
  SJC:{name:'SJC',color:'var(--sjc)'},
  PNJ:{name:'PNJ',color:'var(--pnj)'},
  '9999':{name:'Vàng 9999',color:'var(--g9999)'},
  '97':{name:'Vàng 97',color:'var(--g97)'}
};
// Cột của sheet "chung": nhóm, tên, quy đổi ra chỉ
const COLS = [
  {g:'SJC',  n:'3 phân',        w:0.3},
  {g:'SJC',  n:'5 phân',        w:0.5},
  {g:'SJC',  n:'Thẻ 1 chỉ',     w:1},
  {g:'SJC',  n:'Nhẫn 1 chỉ',    w:1},
  {g:'SJC',  n:'Nhẫn 2 chỉ',    w:2},
  {g:'PNJ',  n:'Nhẫn 5 phân',   w:0.5},
  {g:'PNJ',  n:'Nhẫn 1 chỉ',    w:1},
  {g:'Khác', n:'9999 – 1 chỉ',  w:1},
  {g:'Khác', n:'5 phân',        w:0.5},
  {g:'Khác', n:'2-3 phân',      w:0.25},
  {g:'Khác', n:'Công ty SJC',   w:1},
];
const GROUPS = {SJC:{price:'SJC',cls:'sjc',color:'var(--sjc)'},PNJ:{price:'PNJ',cls:'pnj',color:'var(--pnj)'},'Khác':{price:'9999',cls:'khac',color:'var(--khac)'}};
const serial = n => new Date(Date.UTC(1899,11,30)+n*864e5).toISOString().slice(0,10);

function seed(){   // dữ liệu trống — số liệu thật nhập tay hoặc dùng "Nhập file"
  return {
    prices:{SJC:145.2,PNJ:143.5,'9999':128.5,'97':127.5},
    chung:{rows:[{name:'Nơi cất 1',c:COLS.map(()=>0)}],notes:[]},
    people:{'Người 1':[]}
  };
}
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prices) S=seed();
S.basis=S.basis||'buy'; S.manual=S.manual||{}; S.live=S.live||null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

/* ---------- Tính toán ---------- */
const num = v => { const x=parseFloat(String(v).replace(',','.')); return isFinite(x)?x:0; };
const fmt = (v,d=2)=>v.toLocaleString('vi-VN',{minimumFractionDigits:0,maximumFractionDigits:d});
const val = (chi,type)=> chi/10*num(S.prices[type]);          // triệu đồng
const vnd = tr => fmt(Math.round(tr*1e6),0)+' ₫';

function chungTotals(){
  const colSum=COLS.map((c,i)=>S.chung.rows.reduce((s,r)=>s+num(r.c[i]),0));
  const grp={};
  for(const g in GROUPS) grp[g]={chi:0,qty:0};
  COLS.forEach((c,i)=>{grp[c.g].chi+=colSum[i]*c.w; grp[c.g].qty+=colSum[i];});
  for(const g in grp) grp[g].val=val(grp[g].chi,GROUPS[g].price);
  const chi=Object.values(grp).reduce((s,x)=>s+x.chi,0);
  const v=Object.values(grp).reduce((s,x)=>s+x.val,0);
  return {colSum,grp,chi,val:v};
}
function personTotals(name){
  const by={};
  S.people[name].forEach(l=>{by[l.type]=(by[l.type]||0)+num(l.chi)});
  const rows=Object.keys(TYPES).filter(t=>by[t]!==undefined).map(t=>({type:t,chi:by[t],val:val(by[t],t)}));
  return {rows,chi:rows.reduce((s,r)=>s+r.chi,0),val:rows.reduce((s,r)=>s+r.val,0)};
}

/* ---------- UI helpers ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e;};
let tab='chung', live=[];   // live: các hàm cập nhật số liệu khi gõ
const refresh=()=>{live.forEach(f=>f());save();};
const bind=(el,fn)=>{live.push(()=>{el.textContent=fn()});return el;};

function hero(getTotals,parts){ // parts: [{label,color,get:()=>({chi,val})}]
  const big=h('div',{class:'big'}),sub=h('div',{class:'sub'}),bar=h('div',{class:'stack'}),leg=h('div',{class:'leg'});
  live.push(()=>{
    const t=getTotals();
    big.innerHTML=`${fmt(t.val)}<span>triệu đồng</span>`;
    sub.innerHTML=`≈ <b>${vnd(t.val)}</b><br>${fmt(t.chi)} chỉ • ${fmt(t.chi/10,3)} cây`;
    const ps=parts.map(p=>({...p,...p.get()}));
    bar.innerHTML=ps.filter(p=>p.val>0).map(p=>`<i style="flex:${p.val};background:${p.color}" title="${p.label}"></i>`).join('');
    leg.innerHTML=ps.map(p=>`<div class="lg"><i class="dot" style="background:${p.color};margin:0"></i><span>${p.label}</span><b>${fmt(p.val)} tr</b><em>${t.val?fmt(p.val/t.val*100,0):0}%</em></div>`).join('');
  });
  return h('div',{class:'card hero'},
    h('div',{},h('div',{class:'lbl'},'TỔNG GIÁ TRỊ VÀNG'),big,sub),
    h('div',{},bar,leg));
}

/* ---------- Giá vàng thực tế ---------- */
// PNJ trả giá theo nghìn đồng/chỉ  →  ×10/1000 = triệu đồng/cây
// Vàng 97 không có bảng giá riêng: dùng giá vàng nữ trang 99,2% (gần nhất với cách tính cũ trong file)
const PNJ_MAP={SJC:'SJC',PNJ:'PNJ','9999':'24K','97':'9920'};
const PNJ_URL='https://edge-api.pnj.io/ecom-frontend/v1/get-gold-price?zone=00';
const BACKUP_URL='https://www.vang.today/api/prices';
const SRC_LABEL={SJC:'SJC',PNJ:'PNJ Phượng Hoàng','9999':'PNJ 24K (999.9)','97':'PNJ 99,2%'};
async function fetchJSON(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
async function getPrices(){
  try{
    const d=await fetchJSON(PNJ_URL),raw={};
    for(const t in PNJ_MAP){const x=d.data.find(i=>i.masp===PNJ_MAP[t]);if(!x)throw new Error('thiếu '+t);raw[t]={buy:x.giamua/100,sell:x.giaban/100};}
    return {raw,src:'PNJ',at:d.updateDate||''};
  }catch(e1){
    const d=await fetchJSON(BACKUP_URL),P=d.prices, raw={};
    const m=(k)=>({buy:P[k].buy/1e6,sell:P[k].sell/1e6});
    raw.SJC=m('SJL1L10');raw.PNJ=m('PQHNVM');raw['9999']=m('PQHN24NTT');
    raw['97']={buy:raw['9999'].buy*0.992,sell:raw['9999'].sell*0.992};
    return {raw,src:'vang.today',at:d.date+' '+d.time};
  }
}
function applyLive(){
  if(!S.live)return;
  for(const t in TYPES){ if(S.manual[t])continue; const r=S.live.raw[t]; if(r) S.prices[t]=Math.round(r[S.basis]*100)/100; }
}
let liveState='idle';
function setStatus(kind,txt){const p=$('#pulse');if(p){p.className='pulse '+kind;$('#liveTxt').textContent=txt;}}
function statusText(){
  if(!S.live)return 'Chưa có giá thực tế';
  return `Giá ${S.live.src} • cập nhật ${S.live.at||new Date(S.live.fetched).toLocaleString('vi-VN')}`;
}
async function refreshLive(){
  setStatus('load','Đang cập nhật giá…');
  try{
    const r=await getPrices();
    S.live={...r,fetched:Date.now()};
    applyLive();save();
    setStatus('ok',statusText());
    renderPrices();live.forEach(f=>f());
  }catch(e){
    setStatus('err',(S.live?'Không kết nối được, đang dùng giá đã lưu • ':'Không lấy được giá • ')+(S.live?statusText():'nhập tay bên dưới'));
  }
}
function updPsum(){const e=$('#psum');if(e)e.textContent=Object.keys(TYPES).map(t=>TYPES[t].name.replace('Vàng ','')+' '+fmt(S.prices[t])).join('  •  ');}
function renderPrices(){
  const box=$('#prices');box.innerHTML='';
  Object.keys(TYPES).forEach(t=>{
    const manual=!!S.manual[t];
    const inp=h('input',{type:'number',step:'0.1',value:S.prices[t]});
    inp.addEventListener('input',()=>{S.manual[t]=true;S.prices[t]=num(inp.value);save();live.forEach(f=>f());box.children[Object.keys(TYPES).indexOf(t)].classList.add('manual');});
    inp.addEventListener('change',renderPrices);
    const lr=S.live&&S.live.raw[t];
    const other=lr?(S.basis==='buy'?['Bán ra',lr.sell]:['Mua vào',lr.buy]):null;
    box.append(h('div',{class:'price'+(manual?' manual':''),style:'--c:'+TYPES[t].color},
      h('label',{},TYPES[t].name,h('span',{},S.basis==='buy'?'mua vào':'bán ra')),
      h('div',{class:'row'},inp,h('small',{},'tr/cây')),
      h('div',{class:'src'},
        manual?h('span',{},'✎ Nhập tay'):h('span',{},(SRC_LABEL[t]||'')+(other?` • ${other[0]} ${fmt(other[1])}`:'')),
        manual&&S.live?h('a',{onclick:()=>{delete S.manual[t];applyLive();save();renderPrices();live.forEach(f=>f());}},'↺ Tự động'):'')));
  });
  updPsum();document.querySelectorAll('#basis button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.basis));
}
$('#basis').onclick=e=>{const m=e.target.dataset.m;if(!m)return;S.basis=m;applyLive();save();renderPrices();live.forEach(f=>f());};
$('#btnLive').onclick=refreshLive;

/* ---------- Sheet: chung ---------- */
const GLABEL={SJC:'Vàng SJC',PNJ:'Vàng PNJ','Khác':'Vàng khác'};
function summaryCard(rows,title,note){
  const st=h('tbody');
  rows.forEach(r=>st.append(h('tr',{},
    h('td',{class:'l'},h('i',{class:'dot',style:`background:${r.color}`}),r.label),
    h('td',{class:'r'},bind(h('span'),()=>fmt(r.chi(),3))),
    h('td',{class:'r'},bind(h('span'),()=>fmt(r.price()))),
    h('td',{class:'r'},bind(h('b'),()=>fmt(r.val(),3))))));
  st.append(h('tr',{class:'total'},h('td',{class:'l'},'Tổng'),
    h('td',{class:'r'},bind(h('span'),()=>fmt(rows.reduce((s,r)=>s+r.chi(),0),3))),h('td'),
    h('td',{class:'r'},bind(h('span'),()=>fmt(rows.reduce((s,r)=>s+r.val(),0),3)))));
  return h('div',{class:'card'},h('h2',{},title,h('small',{},note||'')),
    h('div',{class:'scroll'},h('table',{class:'sum'},h('thead',{},h('tr',{},h('th',{class:'l'},'Loại vàng'),h('th',{class:'r'},'Số chỉ'),h('th',{class:'r'},'Giá (tr/cây)'),h('th',{class:'r'},'Giá trị (triệu)'))),st)));
}
function renderChung(v){
  $('#heroBox').append(hero(chungTotals,Object.keys(GROUPS).map(g=>({label:GLABEL[g],color:GROUPS[g].color,get:()=>chungTotals().grp[g]}))));
  v.append(summaryCard(Object.keys(GROUPS).map(g=>({label:GLABEL[g]+(g==='Khác'?' (tính giá 9999)':''),color:GROUPS[g].color,
    chi:()=>chungTotals().grp[g].chi,price:()=>S.prices[GROUPS[g].price],val:()=>chungTotals().grp[g].val})),'Tổng kết vàng'));

  const gs=[...new Set(COLS.map(c=>c.g))];
  const head1=h('tr',{},h('th',{class:'l',rowspan:2},'Nơi cất'));
  gs.forEach(g=>head1.append(h('th',{class:'g',style:'--c:'+GROUPS[g].color,colspan:COLS.filter(c=>c.g===g).length},GLABEL[g])));
  head1.append(h('th',{rowspan:2},'Tổng chỉ'),h('th',{rowspan:2}));
  const head2=h('tr',{},COLS.map(c=>h('th',{html:`${c.n}<small>${c.w} chỉ</small>`})));
  const tb=h('tbody'),tf=h('tfoot');
  S.chung.rows.forEach((r,ri)=>{
    const tr=h('tr',{});
    const nm=h('input',{class:'t',value:r.name,'aria-label':'Tên nơi cất'});nm.addEventListener('input',()=>{r.name=nm.value;save();});
    tr.append(h('td',{class:'l'},nm));
    COLS.forEach((c,i)=>{
      const inp=h('input',{class:'num',type:'number',inputmode:'decimal',min:0,step:'any',placeholder:'–',value:r.c[i]||'','aria-label':r.name+' '+c.n});
      inp.addEventListener('input',()=>{r.c[i]=num(inp.value);refresh();});
      tr.append(h('td',{},inp));
    });
    tr.append(h('td',{class:'tot'},bind(h('span'),()=>fmt(COLS.reduce((s,c,i)=>s+num(r.c[i])*c.w,0)))));
    tr.append(h('td',{},h('button',{class:'del',title:'Xoá dòng',onclick:()=>{if(confirm('Xoá "'+r.name+'"?')){S.chung.rows.splice(ri,1);save();render();}}},'✕')));
    tb.append(tr);
  });
  const ft=h('tr',{},h('td',{class:'l'},'Tổng số lượng'));
  COLS.forEach((c,i)=>ft.append(bind(h('td'),()=>fmt(chungTotals().colSum[i]))));
  ft.append(bind(h('td'),()=>fmt(chungTotals().chi)),h('td'));
  tf.append(ft);
  v.append(h('div',{class:'card'},h('h2',{},'Kiểm kê theo nơi cất',h('small',{},'nhập số lượng (cái) từng loại')),
    h('div',{class:'scroll'},h('table',{class:'inv'},h('thead',{},head1,head2),tb,tf)),
    h('div',{class:'foot'},h('span',{class:'hint'},'App tự quy đổi ra chỉ và tính giá trị.'),
      h('button',{class:'primary',onclick:()=>{S.chung.rows.push({name:'Nơi cất mới',c:COLS.map(()=>0)});save();render();}},'＋ Thêm nơi cất'))));

  const nb=h('tbody');
  S.chung.notes.forEach((n,ni)=>{
    const t=h('input',{class:'t',value:n.t,placeholder:'Mô tả'}),p=h('input',{type:'number',value:n.price,step:'any',placeholder:'–'}),d=h('input',{type:'date',value:n.date});
    t.oninput=()=>{n.t=t.value;save()};p.oninput=()=>{n.price=num(p.value);save()};d.oninput=()=>{n.date=d.value;save()};
    nb.append(h('tr',{},h('td',{class:'l','data-label':'Mô tả'},t),h('td',{'data-label':'Giá mua'},p),h('td',{'data-label':'Ngày mua'},d),h('td',{class:'act'},h('button',{class:'del',onclick:()=>{S.chung.notes.splice(ni,1);save();render();}},'✕'))));
  });
  v.append(h('div',{class:'card'},h('h2',{},'Ghi chú giá mua',h('small',{},'chỉ để ghi nhớ')),
    h('div',{class:'scroll lots'},h('table',{class:'lots'},h('thead',{},h('tr',{},h('th',{class:'l'},'Mô tả'),h('th',{},'Giá mua'),h('th',{},'Ngày mua'),h('th'))),nb)),
    h('div',{class:'foot'},h('span'),h('button',{onclick:()=>{S.chung.notes.push({t:'',price:'',date:''});save();render();}},'＋ Thêm ghi chú'))));
}

/* ---------- Sheet: từng người ---------- */
function renameBtns(name){
  return h('div',{class:'foot',style:'justify-content:flex-end'},
    h('button',{onclick:()=>{const n=(prompt('Tên mới?',name)||'').trim();if(!n||n===name)return;if(n==='chung'||S.people[n]){alert('Tên đã tồn tại');return;}
      const o={};for(const k in S.people)o[k===name?n:k]=S.people[k];S.people=o;tab=n;save();render();}},'✎ Đổi tên'),
    h('button',{class:'del',onclick:()=>{if(confirm('Xoá "'+name+'" và toàn bộ vàng của người này?')){delete S.people[name];tab='chung';save();render();}}},'🗑 Xoá người này'));
}
function renderPerson(v,name){
  const T=()=>personTotals(name), row=t=>T().rows.find(x=>x.type===t)||{chi:0,val:0};
  $('#heroBox').append(hero(T,Object.keys(TYPES).map(t=>({label:TYPES[t].name,color:TYPES[t].color,get:()=>row(t)}))));
  v.append(summaryCard(Object.keys(TYPES).map(t=>({label:TYPES[t].name,color:TYPES[t].color,chi:()=>row(t).chi,price:()=>S.prices[t],val:()=>row(t).val})),'Giá trị từng loại'));

  const tb=h('tbody');
  S.people[name].forEach((l,i)=>{
    const sel=h('select',{'aria-label':'Loại vàng'},Object.keys(TYPES).map(t=>h('option',{value:t,...(l.type===t?{selected:''}:{})},TYPES[t].name)));
    const chi=h('input',{type:'number',inputmode:'decimal',min:0,step:'any',value:l.chi}),pr=h('input',{type:'number',inputmode:'decimal',step:'any',value:l.price,placeholder:'–'}),dt=h('input',{type:'date',value:l.date});
    sel.onchange=()=>{l.type=sel.value;refresh()};chi.oninput=()=>{l.chi=num(chi.value);refresh()};
    pr.oninput=()=>{l.price=pr.value===''?'':num(pr.value);save()};dt.oninput=()=>{l.date=dt.value;save()};
    tb.append(h('tr',{},h('td',{'data-label':'Loại vàng'},sel),h('td',{'data-label':'Số chỉ'},chi),h('td',{'data-label':'Giá lúc mua'},pr),h('td',{'data-label':'Ngày mua'},dt),
      h('td',{class:'val','data-label':'Giá trị hiện tại'},bind(h('b'),()=>fmt(val(num(l.chi),l.type),3)+' tr')),
      h('td',{class:'act'},h('button',{class:'del',title:'Xoá',onclick:()=>{S.people[name].splice(i,1);save();render();}},'✕'))));
  });
  v.append(h('div',{class:'card'},h('h2',{},'Các lần mua của '+name),
    h('div',{class:'scroll lots'},h('table',{class:'lots'},h('thead',{},h('tr',{},h('th',{},'Loại vàng'),h('th',{},'Số chỉ'),h('th',{},'Giá lúc mua'),h('th',{},'Ngày mua'),h('th',{},'Giá trị hiện tại'),h('th'))),tb)),
    h('div',{class:'foot'},h('span',{class:'hint'},'Giá trị = số chỉ ÷ 10 × giá hiện tại.'),
      h('button',{class:'primary',onclick:()=>{S.people[name].push({type:'PNJ',chi:0,price:'',date:new Date().toISOString().slice(0,10)});save();render();}},'＋ Thêm lần mua'))));
  v.append(renameBtns(name));
}

/* ---------- Điều hướng ---------- */
function render(){
  live=[updPsum];
  $('#heroBox').innerHTML='';
  const tabs=$('#tabs');tabs.innerHTML='';
  [['chung','Chung'],...Object.keys(S.people).map(n=>[n,n])].forEach(([k,l])=>
    tabs.append(h('button',{class:'tab'+(tab===k?' on':''),onclick:()=>{tab=k;render();}},l)));
  tabs.append(h('button',{class:'tab',title:'Thêm người',onclick:()=>{const n=(prompt('Tên người mới?')||'').trim();if(!n)return;if(n==='chung'||S.people[n]){alert('Tên đã tồn tại');return;}S.people[n]=[];tab=n;save();render();}},'＋'));
  const v=$('#view');v.innerHTML='';
  if(tab==='chung')renderChung(v);else{ if(!S.people[tab])tab='chung'; tab==='chung'?renderChung(v):renderPerson(v,tab);}
  live.forEach(f=>f());
}
document.addEventListener('click',e=>{const m=$('#menu');if(m&&m.open&&(!m.contains(e.target)||e.target.closest('.dd button')))m.open=false;});
$('#btnExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='vang-'+new Date().toISOString().slice(0,10)+'.json';a.click();};
$('#btnImport').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.prices||!d.chung||!d.people)throw 0;S=d;S.basis=S.basis||'buy';S.manual=S.manual||{};save();renderPrices();render();refreshLive();}catch(_){alert('File không hợp lệ');}});e.target.value='';};
$('#btnReset').onclick=()=>{if(confirm('Xoá toàn bộ dữ liệu trên thiết bị này? (Hãy bấm Xuất file trước nếu cần giữ lại)')){S=seed();S.basis='buy';S.manual={};save();renderPrices();render();refreshLive();}};
if(innerWidth<700)$('#pricesD').open=false;
renderPrices();render();
applyLive();renderPrices();live.forEach(f=>f());
if(S.live)setStatus('',statusText());
refreshLive();
setInterval(refreshLive,60000);                       // tự cập nhật mỗi phút khi đang mở app
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLive();});
window.addEventListener('online',refreshLive);

/* ---------- Cài app (PWA) ---------- */
let deferred;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#btnInstall').hidden=false;});
$('#btnInstall').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#btnInstall').hidden=true;};
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true;});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script>
